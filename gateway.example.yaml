# voitta-gateway config. Secrets are never in here: every *_secret names an
# environment variable (or a line in env_file).
listen:
  api: 0.0.0.0:8700             # private: bind to localhost / the private network only
  ingress: 0.0.0.0:8800         # public via Caddy: Telnyx webhooks + media (phone adapter only)
data_dir: /data
env_file: .env

adapters:
  signal:
    account: "+15550001111"     # a spare number, never a personal one
    data_dir: /signal           # signal-cli --config (holds the account keys)
    tcp: 127.0.0.1:7583
    groups: mention             # mention | all | ignore (applies to groups listed under conversations)
    send_read_receipts: false   # the default; delivery receipts are sent regardless (signal-cli)
    calls: true                 # needs signal-call-tunnel + PulseAudio (Linux)
    route: main

  slack:
    bot_token_secret: SLACK_BOT_TOKEN
    app_token_secret: SLACK_APP_TOKEN   # Socket Mode
    channels: mention                   # DMs, mentions and @here always count
    bots: mention                       # other apps' posts only when they mention us
    calls:                              # outbound voice calls through a browser join page
      public_base_url: https://gw.example.com   # the ingress, reachable by callees' browsers (https)
      route: main
      ring_timeout_s: 60
      card: button                      # or calls_api (Slack's native call card, with fallback)

  # phone:
  #   provider: telnyx
  #   api_key_secret: TELNYX_API_KEY
  #   public_key_secret: TELNYX_PUBLIC_KEY   # Portal -> Keys & Credentials -> Public Key
  #   connection_id: "1234567890"            # Call Control app (needed to dial out)
  #   numbers: ["+15550002222"]
  #   public_base_url: https://gw.example.com
  #   codec: L16                             # 16 kHz both ways; PCMU = 8 kHz
  #   route: main

routes:
  main:
    media_url: ws://127.0.0.1:8765/media     # the voice agent (examples/echo_agent.py, pipecat_bot.py)
    media_secret_secret: VOITTA_MEDIA_SECRET
    answer: auto
    connect_timeout_s: 3
    grace_s: 5
    fallback: reject                         # reject | hangup | transfer:+15551234567

speech:                                 # transcribe inbound voice clips (voitta-ask serves /v1/speech/*)
  url: http://127.0.0.1:8791
  token_secret: TOKEN_SPEECH

consumers:
  agent-core:
    token_secret: TOKEN_AGENT_CORE
    scopes: [events:read, messages:send]
    events: ["message.*", "reaction.*", "contact.*"]
  voice-agent:
    token_secret: TOKEN_VOICE_AGENT
    scopes: [events:read, calls:control]
    events: ["call.*"]
  ops:
    token_secret: TOKEN_OPS
    scopes: [admin]

persons:
  p_roman:
    signal: ["+15551112222"]                 # ACI (UUID) and/or number
    slack: ["T0123/U0456"]
    phone: ["+15551112222"]

# Groups (Signal groups, Slack channels) are closed unless listed: an unlisted
# one produces no events and nothing is stored. Direct messages are governed by
# policy.inbound_allowlist instead.
conversations:
  ops-group:
    channel: signal
    key: "<signal-group-id>"
  ops-channel:
    channel: slack
    key: "<slack-channel-id>"

policy:
  inbound_allowlist: [p_roman]               # default []: everyone else is held; "*" lets everyone through
  calls_allow_unknown: false
  block_emergency_numbers: true
