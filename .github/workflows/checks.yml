name: checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      # Known-vulnerability gate over the installed dependency set. pip-audit
      # cannot audit this package itself (editable, not on PyPI), so it audits a
      # freeze of everything else. --strict: a package it cannot resolve fails
      # the build instead of being silently skipped.
      - name: pip-audit
        run: |
          pip freeze --exclude-editable > /tmp/frozen.txt
          pip install pip-audit
          pip-audit --strict --disable-pip --no-deps -r /tmp/frozen.txt

      # Offline tests. The *_real tests need a GPU and live services; they run by
      # hand on the host that has them, never on a hosted runner.
      - name: Tests
        run: |
          pytest -q \
            --ignore=tests/test_ask_real.py \
            --ignore=tests/test_speech_real.py

      # The release workflow tags from voitta_gateway.__version__; the wheel is
      # versioned from pyproject.toml. Two numbers for one release must agree.
      - name: Versions agree
        run: |
          python3 - <<'EOF'
          import re, sys, tomllib, pathlib
          init = re.search(r'__version__ = "([^"]+)"',
                           pathlib.Path("voitta_gateway/__init__.py").read_text()).group(1)
          proj = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if init != proj:
              sys.exit(f"voitta_gateway.__version__ {init} != pyproject.toml version {proj}")
          print("version", init)
          EOF

      # The file every new operator copies must still load.
      - name: Example config loads
        run: python3 -c "from voitta_gateway import config; config.load('gateway.example.yaml')"

      # Structural pre-publish gate (ported from shmobster): token and key
      # shapes, account ids, private IPs, internal domains. The name wordlist
      # is private and stays off CI. spec/ is not scanned: its JSON-pointer
      # $refs are 40-character paths that match the AWS-secret shape.
      - name: Sensitive-term gate (structural)
        run: |
          bash scripts/check-sensitive-terms.sh \
            voitta_gateway/ voitta_ask/ voitta_speech/ examples/ deploy/ docs/ \
            README.md gateway.example.yaml .env.example
