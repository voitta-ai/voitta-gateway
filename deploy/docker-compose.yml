# One host: the gateway (private API on localhost) + Caddy terminating TLS for the
# public ingress (Telnyx webhooks and media). Agents reach the API over the private
# network; nothing but /telnyx/* is exposed.
name: voitta                               # volumes: voitta_gateway-data, voitta_signal-data
services:
  gateway:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: ../.env                      # secrets: tokens, API keys (see .env.example)
    volumes:
      - ../gateway.yaml:/etc/voitta/gateway.yaml:ro
      - gateway-data:/data                 # SQLite event log, outbox, attachments
      - signal-data:/signal                # signal-cli account keys: treat as a secret
    ports:
      - "127.0.0.1:8700:8700"              # private API
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [internal]
    profiles: [phone]                      # only needed once the phone adapter is on

networks:
  internal: {}

volumes:
  gateway-data: {}
  signal-data: {}
  caddy-data: {}
