openapi: 3.1.0
info:
  title: voitta-gateway API
  version: 1.0.0
  description: |
    Private command API of voitta-gateway: one API in front of Signal, Slack and the phone network.

    - Every request carries `Authorization: Bearer <consumer token>`; each consumer in gateway.yaml
      has its own token and scopes (`events:read`, `messages:send`, `calls:control`, `admin`;
      `admin` implies all). The scope an operation needs is in `x-scope`.
    - Errors always have the shape `Error`.
    - Mutating commands are asynchronous: they return 202 and the outcome arrives as events
      (see voitta.asyncapi.yaml). With `idempotency_key`, a repeated request returns the first
      result with HTTP 200 and `duplicate: true` (keys are kept 24 h).
    - The event stream (`GET /v1/events`, server-sent events) and the per-call media WebSocket are
      specified in voitta.asyncapi.yaml.
servers:
  - url: http://127.0.0.1:8700
    description: private listener (bind to localhost or a private network only)
security:
  - bearer: []

paths:
  /v1/health:
    get:
      operationId: health
      summary: Liveness and per-channel connection state
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}

  /v1/channels:
    get:
      operationId: listChannels
      summary: Adapters, accounts, capabilities and connection state
      x-scope: events:read
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels: {type: array, items: {$ref: "#/components/schemas/Channel"}}
        default: {$ref: "#/components/responses/Error"}

  /v1/conversations:
    get:
      operationId: listConversations
      summary: The listed group conversations this token serves, by label
      description: >-
        Entries of the gateway's `conversations` map that the caller serves (an entry naming no
        consumer is served by all), so a consumer finds its groups without holding their ids and
        sends to them with `to: {conversation: <label>}`. Admin tokens see every entry. Entries for
        a channel with no adapter are left out.
      x-scope: events:read
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations: {type: array, items: {$ref: "#/components/schemas/ListedConversation"}}
        default: {$ref: "#/components/responses/Error"}

  /v1/conversations/{label}/members:
    get:
      operationId: listMembers
      summary: A listed group's members and whether it is open
      description: >-
        For a consumer that serves the conversation (Signal). Members carry the account id (the ACI, or the number when signal-cli has no ACI), the
        admin flag, and `person_id`/`agent` from `persons` (never a profile name). `open` is true
        when a group link is on or members other than admins can add members; `reasons` says which.
      x-scope: events:read
      parameters: [{name: label, in: path, required: true, schema: {type: string}}]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [label, admit, members, open, reasons]
                properties:
                  label: {type: string}
                  admit: {type: string, enum: [allowlist, members]}
                  members:
                    type: array
                    items:
                      type: object
                      required: [id, admin, self, person_id, agent]
                      properties:
                        id: {type: string}
                        admin: {type: boolean}
                        self: {type: boolean, description: "this account"}
                        person_id: {type: [string, "null"]}
                        agent: {type: boolean}
                  open: {type: boolean}
                  reasons: {type: array, items: {type: string}}
        default: {$ref: "#/components/responses/Error"}

  /v1/identities/{person_id}:
    get:
      operationId: getIdentity
      summary: Platform addresses of a configured person
      x-scope: events:read
      parameters: [{name: person_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Identity"}
        default: {$ref: "#/components/responses/Error"}

  /v1/messages:
    post:
      operationId: sendMessage
      summary: Queue a message
      description: |
        Replies go back to the conversation they answer: `to: {conversation_id}`. A `person_id`
        target is for conversations the agent starts itself; the gateway then picks a channel.
        Derive `idempotency_key` from the event being answered (e.g. `reply:evt_42`).
        Outcome: `message.status` events (queued -> sent -> delivered -> read, or failed), addressed
        to the sending consumer. `to: {conversation: <label>}` posts into a mapped group that has had
        no inbound traffic. A send into an unlisted group, a group outside the consumer's map entries,
        or a direct conversation another consumer serves is 403 (`not_listed`, `forbidden_conversation`);
        a direct conversation with no messages yet may be started by any consumer. A person reached by
        another address (a number for an ACI) lands in their existing direct conversation.
      x-scope: messages:send
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SendMessageRequest"}
      responses:
        "202":
          description: queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageQueued"}
        "200":
          description: sent (with wait_s), or a duplicate of an earlier request with the same idempotency_key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageQueued"}
        default: {$ref: "#/components/responses/Error"}

  /v1/posts:
    post:
      operationId: postForReview
      summary: Post files into a closed group from the gateway account, addressed to agents (voitta-post)
      description: |
        Only consumers under `post.consumers`, only into groups under `post.groups`, and only while
        the group is closed (no group link, only admins add members): 403 `not_a_poster` or
        `group_not_allowed`, 409 `group_open` or `not_member`. `to` names agents or people: a `persons` entry
        is @-mentioned; a consumer serving the group has its first name keyword written
        into the text and gets the post as its own `message.received` (same message_id; sender
        `{kind: tool, id: <calling consumer>}`; neutral file names). The text is fixed: the addressing,
        then the optional title (one line, at most 100 characters, never "approve" or "deny"; else 422
        `bad_post`). Upload the files first with POST /v1/attachments.
      x-scope: messages:send
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group, to, attachments]
              properties:
                group: {type: string, description: "a conversations label listed under post.groups"}
                to: {type: array, minItems: 1, items: {type: string}}
                title: {type: string, maxLength: 100}
                attachments: {type: array, minItems: 1, items: {type: string}, description: "attachment ids"}
                idempotency_key: {type: string}
      responses:
        "202":
          description: queued
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/MessageQueued"}
                  - type: object
                    properties:
                      group: {type: string}
                      mentioned: {type: integer}
                      delivered_to: {type: array, items: {type: string}}
        "200":
          description: duplicate of an earlier request with the same idempotency_key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageQueued"}
        default: {$ref: "#/components/responses/Error"}

  /v1/messages/{message_id}:
    get:
      operationId: getMessage
      x-scope: events:read
      parameters: [{$ref: "#/components/parameters/MessageId"}]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageView"}
        default: {$ref: "#/components/responses/Error"}

  /v1/messages/{message_id}/edit:
    post:
      operationId: editMessage
      summary: Edit one of the gateway's own messages (if the channel supports it)
      x-scope: messages:send
      parameters: [{$ref: "#/components/parameters/MessageId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parts]
              properties:
                parts: {type: array, minItems: 1, items: {$ref: "#/components/schemas/Part"}}
                idempotency_key: {type: string}
      responses:
        "202": {$ref: "#/components/responses/OperationQueued"}
        "200": {$ref: "#/components/responses/OperationQueued"}
        default: {$ref: "#/components/responses/Error"}

  /v1/messages/{message_id}/delete:
    post:
      operationId: deleteMessage
      summary: Delete one of the gateway's own messages for everyone (if supported)
      x-scope: messages:send
      parameters: [{$ref: "#/components/parameters/MessageId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotency_key: {type: string}
      responses:
        "202": {$ref: "#/components/responses/OperationQueued"}
        "200": {$ref: "#/components/responses/OperationQueued"}
        default: {$ref: "#/components/responses/Error"}

  /v1/messages/{message_id}/reactions:
    post:
      operationId: reactToMessage
      summary: Add or remove a reaction (Unicode emoji; Slack names are accepted too)
      x-scope: messages:send
      parameters: [{$ref: "#/components/parameters/MessageId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: {type: string, minLength: 1}
                remove: {type: boolean, default: false}
                idempotency_key: {type: string}
      responses:
        "202": {$ref: "#/components/responses/OperationQueued"}
        "200": {$ref: "#/components/responses/OperationQueued"}
        default: {$ref: "#/components/responses/Error"}

  /v1/messages/{message_id}/vote:
    post:
      operationId: votePoll
      summary: "Vote on a poll (Signal): option indexes, 0-based; [] withdraws the vote"
      x-scope: messages:send
      parameters: [{$ref: "#/components/parameters/MessageId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [options]
              properties:
                options: {type: array, items: {type: integer, minimum: 0}}
                idempotency_key: {type: string}
      responses:
        "202": {$ref: "#/components/responses/OperationQueued"}
        "200": {$ref: "#/components/responses/OperationQueued"}
        default: {$ref: "#/components/responses/Error"}

  /v1/messages/{message_id}/end_poll:
    post:
      operationId: endPoll
      summary: "End a poll this account created (Signal)"
      x-scope: messages:send
      parameters: [{$ref: "#/components/parameters/MessageId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotency_key: {type: string}
      responses:
        "202": {$ref: "#/components/responses/OperationQueued"}
        "200": {$ref: "#/components/responses/OperationQueued"}
        default: {$ref: "#/components/responses/Error"}

  /v1/messages/{message_id}/pin:
    post:
      operationId: pinMessage
      summary: "Pin a message in its conversation (Signal)"
      x-scope: messages:send
      parameters: [{$ref: "#/components/parameters/MessageId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                duration_s: {type: integer, default: -1, description: "seconds, or -1 for no end"}
                idempotency_key: {type: string}
      responses:
        "202": {$ref: "#/components/responses/OperationQueued"}
        "200": {$ref: "#/components/responses/OperationQueued"}
        default: {$ref: "#/components/responses/Error"}

  /v1/messages/{message_id}/unpin:
    post:
      operationId: unpinMessage
      summary: "Unpin a message (Signal)"
      x-scope: messages:send
      parameters: [{$ref: "#/components/parameters/MessageId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotency_key: {type: string}
      responses:
        "202": {$ref: "#/components/responses/OperationQueued"}
        "200": {$ref: "#/components/responses/OperationQueued"}
        default: {$ref: "#/components/responses/Error"}

  /v1/conversations/{conversation_id}/disappearing:
    post:
      operationId: setDisappearing
      summary: "Set the disappearing-messages timer of a conversation (Signal); 0 turns it off"
      x-scope: messages:send
      parameters: [{name: conversation_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seconds]
              properties:
                seconds: {type: integer, minimum: 0, maximum: 2419200}
                idempotency_key: {type: string}
      responses:
        "202":
          description: queued; outcome as operation.done / operation.failed (op disappearing)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationOpQueued"}
        "200":
          description: duplicate of an earlier request with the same idempotency_key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationOpQueued"}
        default: {$ref: "#/components/responses/Error"}

  /v1/conversations/{conversation_id}/typing:
    post:
      operationId: setTyping
      x-scope: messages:send
      parameters: [{name: conversation_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                "on": {type: boolean, default: true}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        default: {$ref: "#/components/responses/Error"}

  /v1/conversations/{conversation_id}/history:
    get:
      operationId: getHistory
      summary: Recent messages, from the platform (`history` capability) or the gateway's own record
      description: |
        Newest last. With `thread`, the messages of the thread that message belongs to.
        Platforms without a history API (Signal) are served from what the gateway recorded since it
        started: messages it delivered as events (no held senders, no unaddressed group chatter) and
        its own sends, kept current through edits and deletes.
        From a platform API (Slack) it includes messages the gateway never delivered as events
        (other people talking without a mention, the agent's own posts): this is context, not a
        second event stream.
      x-scope: events:read
      parameters:
        - {name: conversation_id, in: path, required: true, schema: {type: string}}
        - {name: thread, in: query, description: "message_id in this conversation", schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 25}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [conversation_id, messages]
                properties:
                  conversation_id: {type: string}
                  messages: {type: array, items: {$ref: "#/components/schemas/HistoryMessage"}}
        default: {$ref: "#/components/responses/Error"}

  /v1/attachments:
    post:
      operationId: uploadAttachment
      summary: Upload a file; use the returned part in sendMessage
      x-scope: messages:send
      parameters:
        - {name: X-Filename, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, contentMediaType: application/octet-stream}
      responses:
        "200":
          description: stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FilePart"}
        default: {$ref: "#/components/responses/Error"}

  /v1/attachments/{attachment_id}:
    get:
      operationId: downloadAttachment
      x-scope: events:read
      parameters: [{name: attachment_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200":
          description: the file, with its stored content type
          content:
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        default: {$ref: "#/components/responses/Error"}

  /v1/events:
    get:
      operationId: streamEvents
      summary: Event stream (server-sent events); payloads in voitta.asyncapi.yaml
      description: |
        Each SSE message: `id:` = event id, `event:` = event type, `data:` = the event as JSON.
        Resume without gaps with the `Last-Event-ID` header or `after`. `after=now` starts at the
        end of the log. A cursor beyond the end of the log (from an earlier gateway database)
        replays the current log from the start.
      x-scope: events:read
      parameters:
        - {$ref: "#/components/parameters/After"}
        - {$ref: "#/components/parameters/Types"}
        - {name: Last-Event-ID, in: header, schema: {type: string, pattern: "^evt_[0-9]+$"}}
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}

  /v1/events/poll:
    get:
      operationId: pollEvents
      summary: Long-poll the event log (same events as the stream)
      x-scope: events:read
      parameters:
        - {$ref: "#/components/parameters/After"}
        - {$ref: "#/components/parameters/Types"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {name: wait, in: query, description: "seconds to wait for new events (max 30)",
           schema: {type: number, minimum: 0, maximum: 30, default: 0}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [events, next]
                properties:
                  events:
                    type: array
                    description: "Event objects; schema `Event` in voitta.asyncapi.yaml"
                    items: {type: object}
                  next: {type: string, pattern: "^evt_[0-9]+$", description: "pass as `after` next time"}
                  reset:
                    type: boolean
                    description: "true when `after` was beyond the end of this log: the gateway's data was reset and the log is replayed from the start"
        default: {$ref: "#/components/responses/Error"}

  /v1/calls:
    post:
      operationId: startCall
      summary: Place an outbound call; the route's agent gets the audio
      description: |
        The gateway connects to the route's agent media URL before dialing; the agent gets
        `start` once the callee answers. Progress: `call.ringing`, `call.answered`, `call.ended`.
        Emergency numbers are refused (403); opted-out recipients too (409).
      x-scope: calls:control
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StartCallRequest"}
      responses:
        "202":
          description: dialing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallStarted"}
        "200":
          description: duplicate of an earlier request with the same idempotency_key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallStarted"}
        default: {$ref: "#/components/responses/Error"}

  /v1/calls/{call_id}:
    get:
      operationId: getCall
      summary: Current or final state of a call
      x-scope: events:read
      parameters: [{$ref: "#/components/parameters/CallId"}]
      responses:
        "200": {$ref: "#/components/responses/Call"}
        default: {$ref: "#/components/responses/Error"}

  /v1/calls/{call_id}/answer:
    post:
      operationId: answerCall
      summary: "Answer a ringing inbound call (routes with `answer: manual`)"
      x-scope: calls:control
      parameters: [{$ref: "#/components/parameters/CallId"}]
      responses:
        "200": {$ref: "#/components/responses/Call"}
        default: {$ref: "#/components/responses/Error"}

  /v1/calls/{call_id}/reject:
    post:
      operationId: rejectCall
      x-scope: calls:control
      parameters: [{$ref: "#/components/parameters/CallId"}]
      responses:
        "200": {$ref: "#/components/responses/Call"}
        default: {$ref: "#/components/responses/Error"}

  /v1/calls/{call_id}/hangup:
    post:
      operationId: hangupCall
      summary: End a call (idempotent)
      x-scope: calls:control
      parameters: [{$ref: "#/components/parameters/CallId"}]
      responses:
        "200": {$ref: "#/components/responses/Call"}
        default: {$ref: "#/components/responses/Error"}

  /v1/calls/{call_id}/dtmf:
    post:
      operationId: sendDtmf
      x-scope: calls:control
      parameters: [{$ref: "#/components/parameters/CallId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [digits]
              properties:
                digits: {type: string, pattern: "^[0-9*#A-Dw]+$", description: "w = 0.5 s pause"}
      responses:
        "200": {$ref: "#/components/responses/Call"}
        default: {$ref: "#/components/responses/Error"}

  /v1/calls/{call_id}/transfer:
    post:
      operationId: transferCall
      x-scope: calls:control
      parameters: [{$ref: "#/components/parameters/CallId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: {type: string}
                mode: {type: string, enum: [blind, warm], default: blind}
      responses:
        "200": {$ref: "#/components/responses/Call"}
        default: {$ref: "#/components/responses/Error"}

  /v1/calls/{call_id}/recording:
    post:
      operationId: controlRecording
      summary: Not implemented yet (always 422 unsupported)
      x-scope: calls:control
      parameters: [{$ref: "#/components/parameters/CallId"}]
      responses:
        default: {$ref: "#/components/responses/Error"}

  /v1/signal/contacts:
    get:
      operationId: listSignalContacts
      summary: "The Signal account's address book (names are also added to senders as contact_name)"
      x-scope: admin
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [contacts]
                properties:
                  contacts:
                    type: array
                    items:
                      type: object
                      required: [id, number, name, blocked]
                      properties:
                        id: {type: [string, "null"], description: "ACI, or number"}
                        number: {type: [string, "null"]}
                        name: {type: [string, "null"]}
                        blocked: {type: boolean}
        default: {$ref: "#/components/responses/Error"}

  /v1/signal/stickers:
    get:
      operationId: listStickerPacks
      summary: "Sticker packs this Signal account knows, with their stickers"
      x-scope: events:read
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [packs]
                properties:
                  packs:
                    type: array
                    items:
                      type: object
                      required: [pack_id, title, author, installed, stickers]
                      properties:
                        pack_id: {type: [string, "null"]}
                        title: {type: [string, "null"]}
                        author: {type: [string, "null"]}
                        installed: {type: boolean}
                        url: {type: [string, "null"]}
                        stickers:
                          type: array
                          items:
                            type: object
                            properties:
                              sticker_id: {type: [integer, "null"]}
                              emoji: {type: [string, "null"]}
                              content_type: {type: [string, "null"]}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: addStickerPack
      summary: "Install a sticker pack from its signal.art link"
      x-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, pattern: "^https://signal\\.art/addstickers/"}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        default: {$ref: "#/components/responses/Error"}

  /v1/signal/stickers/{pack_id}/{sticker_id}:
    get:
      operationId: getStickerImage
      summary: "A sticker's image (webp or png), e.g. for a sticker part someone sent"
      x-scope: events:read
      parameters:
        - {name: pack_id, in: path, required: true, schema: {type: string, pattern: "^[0-9a-fA-F]{32}$"}}
        - {name: sticker_id, in: path, required: true, schema: {type: integer, minimum: 0}}
      responses:
        "200":
          description: the image
          content:
            image/webp: {schema: {type: string, contentMediaType: image/webp}}
            image/png: {schema: {type: string, contentMediaType: image/png}}
        default: {$ref: "#/components/responses/Error"}

  /v1/signal/groups/join:
    post:
      operationId: joinGroup
      summary: "Join a group by its invite link; it stays closed until listed under `conversations`"
      x-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uri]
              properties:
                uri: {type: string, pattern: "^https://signal\\.group/#"}
      responses:
        "200":
          description: joined (or a join request sent, for groups that approve members)
          content:
            application/json:
              schema:
                type: object
                required: [group]
                properties:
                  group: {type: [string, "null"], description: "the group id, for `conversations`"}
        default: {$ref: "#/components/responses/Error"}

  /v1/signal/groups/{group_id}/accept:
    post:
      operationId: acceptGroupInvite
      summary: "Accept a pending invitation (see the group.invited event); the group stays closed until listed"
      x-scope: admin
      parameters: [{name: group_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        default: {$ref: "#/components/responses/Error"}

  /v1/held:
    get:
      operationId: listHeld
      summary: Messages from unknown senders, held without content until approved
      x-scope: admin
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [held]
                properties:
                  held:
                    type: array
                    items:
                      type: object
                      required: [held_id, channel, sender, conversation_id, time]
                      properties:
                        held_id: {type: string}
                        channel: {$ref: "#/components/schemas/ChannelName"}
                        sender: {type: string}
                        conversation_id: {type: string}
                        time: {type: string, format: date-time}
        default: {$ref: "#/components/responses/Error"}

  /v1/held/{held_id}/approve:
    post:
      operationId: approveHeld
      summary: Allow the sender and release everything held from them (as message.received)
      x-scope: admin
      parameters: [{$ref: "#/components/parameters/HeldId"}]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [released]
                properties:
                  released: {type: integer, minimum: 1}
        default: {$ref: "#/components/responses/Error"}

  /v1/held/{held_id}/discard:
    post:
      operationId: discardHeld
      x-scope: admin
      parameters: [{$ref: "#/components/parameters/HeldId"}]
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        default: {$ref: "#/components/responses/Error"}

  /v1/optouts:
    get:
      operationId: listOptOuts
      x-scope: admin
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [optouts]
                properties:
                  optouts:
                    type: array
                    items:
                      type: object
                      required: [channel, address, created]
                      properties:
                        channel: {$ref: "#/components/schemas/ChannelName"}
                        address: {type: string}
                        created: {type: number, description: unix time}
        default: {$ref: "#/components/responses/Error"}

  /v1/optouts/{channel}/{address}:
    delete:
      operationId: removeOptOut
      x-scope: admin
      parameters:
        - {name: channel, in: path, required: true, schema: {$ref: "#/components/schemas/ChannelName"}}
        - {name: address, in: path, required: true, schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        default: {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}

  parameters:
    MessageId: {name: message_id, in: path, required: true, schema: {type: string, pattern: "^msg_"}}
    CallId: {name: call_id, in: path, required: true, schema: {type: string, pattern: "^call_"}}
    HeldId: {name: held_id, in: path, required: true, schema: {type: string, pattern: "^held_"}}
    After:
      name: after
      in: query
      description: "event id to continue after (evt_N), or `now`"
      schema: {type: string, pattern: "^(evt_[0-9]+|now)$"}
    Types:
      name: types
      in: query
      description: "comma-separated type patterns without prefix/version, e.g. `message.*,call.ended`"
      schema: {type: string}

  responses:
    Error:
      description: error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Ok:
      description: ok
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: {type: boolean}
    OperationQueued:
      description: queued; outcome as operation.done / operation.failed
      content:
        application/json:
          schema:
            type: object
            required: [op_id, message_id, status]
            properties:
              op_id: {type: string, pattern: "^op_"}
              message_id: {type: string}
              status: {const: queued}
              duplicate: {type: boolean}
    Call:
      description: the call
      content:
        application/json:
          schema: {$ref: "#/components/schemas/CallView"}

  schemas:
    ConversationOpQueued:
      type: object
      required: [op_id, conversation_id, status]
      properties:
        op_id: {type: string, pattern: "^op_"}
        conversation_id: {type: string}
        status: {const: queued}
        duplicate: {type: boolean}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                bad_request, bad_json, unauthorized, forbidden, unknown_channel, unknown_person,
                unknown_conversation, unknown_message, unknown_call, unknown_held, unknown_route,
                unknown_attachment, bad_target, bad_reply_to, bad_digits, bad_emoji, empty,
                no_route, no_voice, opted_out, unsupported, not_ours, not_sent_yet, bad_state,
                agent_not_connected, call_ended, emergency_number_blocked,
                forbidden_conversation, not_listed, not_yours (403: outside the consumer's conversations),
                too_long, bad_text, bad_styles, bad_mentions, bad_parts, bad_wait (422), deleted (409),
                send_failed (502, with wait_s), key_reused (409: an idempotency_key from another kind of request), message_gone (409: the key's message no longer exists),
                not_member (409: the account is not in that group), unavailable (503: group state could not be read; retry)
            message: {type: string}

    ChannelName: {type: string, enum: [signal, slack, phone]}

    Health:
      type: object
      required: [ok, channels]
      properties:
        ok: {type: boolean}
        channels: {type: object, additionalProperties: {type: boolean}}

    ListedConversation:
      type: object
      required: [label, channel, consumers, default]
      properties:
        label: {type: string, description: "the key in gateway.yaml `conversations`; events carry it as `conversation`"}
        channel: {$ref: "#/components/schemas/ChannelName"}
        consumers: {type: array, items: {type: string}, description: "serving consumers in configured order; empty = all; see `default`"}
        default: {type: [string, "null"], description: "who an unaddressed message goes to; null = every consumer"}

    Channel:
      type: object
      required: [channel, account, messaging, calls, up]
      properties:
        channel: {$ref: "#/components/schemas/ChannelName"}
        account: {type: string}
        messaging:
          description: messaging capabilities, null for voice-only channels
          type: [object, "null"]
          properties:
            text: {type: boolean}
            attachments: {type: boolean}
            reactions: {type: boolean}
            edit: {type: boolean}
            delete: {type: boolean}
            typing: {type: boolean}
            threads: {type: boolean}
            receipts: {type: array, items: {type: string, enum: [delivered, read]}}
            markdown: {type: boolean}
            blocks: {type: boolean, description: "accepts `blocks` parts (Slack Block Kit)"}
            history: {type: boolean, description: "GET /v1/conversations/{id}/history works"}
            interactions: {type: boolean, description: "emits interaction.received for buttons and menus"}
            voice_clips: {type: boolean}
            max_attachment_mb: {type: number}
            max_text_bytes: {type: integer, description: "text limit in UTF-8 bytes, parts joined by newlines; longer sends are 422 too_long"}
            styles: {type: boolean, description: "text parts accept `styles`"}
            mentions: {type: boolean, description: "text parts accept `mentions`"}
            stickers: {type: boolean, description: "sticker parts; GET /v1/signal/stickers"}
            view_once: {type: boolean, description: "file parts accept `view_once`"}
            link_previews: {type: boolean, description: "link_preview parts"}
            polls: {type: boolean, description: "poll parts; vote and end_poll"}
            pins: {type: boolean, description: "pin and unpin"}
            disappearing: {type: boolean, description: "POST /v1/conversations/{id}/disappearing"}
            contacts: {type: boolean, description: "address-book names on senders; GET /v1/signal/contacts"}
            group_invites: {type: boolean, description: "group.invited events; join and accept"}
        calls:
          description: call capabilities, null for messaging-only channels
          type: [object, "null"]
          properties:
            inbound: {type: boolean}
            outbound: {type: boolean}
            dtmf: {type: boolean}
            transfer: {type: array, items: {type: string, enum: [blind, warm]}}
            audio: {type: string}
        up: {type: boolean}

    Identity:
      type: object
      required: [person_id, addresses]
      properties:
        person_id: {type: string}
        addresses:
          type: object
          required: [signal, slack, phone]
          properties:
            signal: {type: array, items: {type: string}}
            slack: {type: array, items: {type: string}}
            phone: {type: array, items: {type: string}}

    Part:
      oneOf:
        - {$ref: "#/components/schemas/TextPart"}
        - {$ref: "#/components/schemas/FilePart"}
        - {$ref: "#/components/schemas/StickerPart"}
        - {$ref: "#/components/schemas/BlocksPart"}
        - {$ref: "#/components/schemas/LinkPreviewPart"}
        - {$ref: "#/components/schemas/PollPart"}
        - {$ref: "#/components/schemas/PollVotePart"}
        - {$ref: "#/components/schemas/PollEndPart"}
        - {$ref: "#/components/schemas/PinPart"}
        - {$ref: "#/components/schemas/UnpinPart"}
        - {$ref: "#/components/schemas/ContactPart"}
        - {$ref: "#/components/schemas/DisappearingPart"}
        - {$ref: "#/components/schemas/PaymentPart"}
        - {$ref: "#/components/schemas/OtherPart"}
    HistoryMessage:
      type: object
      required: [platform_id, thread, time, sender, parts, message_id, person_id]
      properties:
        platform_id: {type: string, description: "the platform's id (Slack ts)"}
        thread: {type: [string, "null"]}
        time: {type: string, format: date-time}
        sender:
          type: object
          required: [id, kind]
          properties:
            id: {type: [string, "null"]}
            kind: {type: string, enum: [human, bot, self]}
            name: {type: [string, "null"]}
            team: {type: [string, "null"]}
        parts: {type: array, items: {$ref: "#/components/schemas/Part"}}
        mentions:
          type: [array, "null"]
          description: |
            As on the inbound event, and only from the gateway's own record (Signal): offsets in
            UTF-16 code units, each mention one U+FFFC in the text. Absent from platform-API
            history (Slack). Without these the recorded text is a sentence with holes in it, and a
            reader cannot tell an unresolved mention from someone who typed the placeholder.
            null when none were recorded: a message received before the gateway recorded
            mentions, or one sent through this API, whose mentions are in `parts[].mentions`
            (offsets into that part's text) as they were sent.
          items:
            type: object
            properties:
              id: {type: [string, "null"], description: "ACI, or number"}
              start: {type: [integer, "null"]}
              length: {type: [integer, "null"]}
              self: {type: boolean, description: "this account was mentioned"}
        message_id: {type: [string, "null"], description: "our id, if the gateway has seen this message"}
        person_id: {type: [string, "null"]}
    BlocksPart:
      description: "Slack Block Kit blocks, sent as is (outbound only; channels with the `blocks` capability)"
      type: object
      required: [type, blocks]
      properties:
        type: {const: blocks}
        blocks: {type: array, minItems: 1, items: {type: object}}
        text: {type: string, description: "notification / fallback text"}
    TextPart:
      type: object
      required: [type, text]
      properties:
        type: {const: text}
        text: {type: string, description: "final text: the gateway renders no Markdown and splits nothing"}
        styles:
          type: array
          description: "ranges in UTF-16 code units into this part's text (channels with `styles`)"
          items:
            type: object
            required: [start, length, style]
            properties:
              start: {type: integer, minimum: 0}
              length: {type: integer, minimum: 1}
              style: {type: string, enum: [BOLD, ITALIC, SPOILER, STRIKETHROUGH, MONOSPACE]}
        mentions:
          type: array
          description: "people to mention (channels with `mentions`): each sits on one U+FFFC in the text, start in UTF-16 code units; else 422 bad_mentions"
          items:
            type: object
            required: [id, start, length]
            properties:
              id: {type: string, pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|\\+[0-9]{6,15})$", description: "the person's sender.id as events report it: an ACI, or a +number"}
              start: {type: integer, minimum: 0}
              length: {const: 1}
    FilePart:
      type: object
      required: [type, attachment_id]
      properties:
        type: {const: file}
        attachment_id: {type: [string, "null"], description: "null when the platform file could not be fetched (then missing: true)"}
        content_type: {type: [string, "null"]}
        filename: {type: [string, "null"]}
        size: {type: [integer, "null"]}
        sha256: {type: string}
        caption: {type: string}
        missing: {type: boolean}
        clip: {type: boolean, description: "recorded in Slack as a voice clip"}
        duration_s: {type: [number, "null"]}
        transcript: {type: string, description: "audio parts: what was said"}
        transcript_source: {type: string, enum: [slack, voitta-speech]}
        transcript_error: {type: string}
        voice_note: {type: boolean, description: "recorded as a voice note (Signal), not an audio file"}
        view_once: {type: boolean, description: "inbound: sent as view-once; outbound: send it view-once (Signal)"}
    StickerPart:
      type: object
      required: [type]
      properties:
        type: {const: sticker}
        pack_id: {type: [string, "null"]}
        sticker_id: {type: [integer, string, "null"]}

    LinkPreviewPart:
      description: "a link preview card (Signal). Outbound: the url must appear in the message text"
      type: object
      required: [type, url]
      properties:
        type: {const: link_preview}
        url: {type: [string, "null"]}
        title: {type: [string, "null"]}
        description: {type: [string, "null"]}
    PollPart:
      description: "a poll (Signal). Outbound: sent on its own, as the only part"
      type: object
      required: [type, question, options]
      properties:
        type: {const: poll}
        question: {type: [string, "null"], minLength: 1}
        options: {type: array, minItems: 2, maxItems: 10, items: {type: string}}
        multiple: {type: boolean, default: true, description: "voters may pick several options"}
    PollVotePart:
      description: "inbound: someone voted (Signal); `poll` is the poll's platform id"
      type: object
      required: [type, poll, options]
      properties:
        type: {const: poll_vote}
        poll: {type: [string, "null"]}
        options: {type: array, items: {type: integer}}
        vote_count: {type: [integer, "null"], description: "the voter's vote number; the highest one stands"}
    PollEndPart:
      description: "inbound: the poll's creator ended it (Signal)"
      type: object
      required: [type, poll]
      properties:
        type: {const: poll_end}
        poll: {type: [string, "null"]}
    PinPart:
      description: "inbound: a message was pinned (Signal); `target` is its platform id"
      type: object
      required: [type, target]
      properties:
        type: {const: pin}
        target: {type: [string, "null"]}
        duration_s: {type: [integer, "null"], description: "-1: no end"}
    UnpinPart:
      type: object
      required: [type, target]
      properties:
        type: {const: unpin}
        target: {type: [string, "null"]}
    ContactPart:
      description: "inbound: a shared contact card (Signal)"
      type: object
      required: [type]
      properties:
        type: {const: contact}
        name: {type: [string, "null"]}
        phones: {type: array, items: {type: string}}
        emails: {type: array, items: {type: string}}
        organization: {type: [string, "null"]}
    DisappearingPart:
      description: "inbound: the conversation's disappearing-messages timer changed (Signal); 0 = off"
      type: object
      required: [type, seconds]
      properties:
        type: {const: disappearing}
        seconds: {type: integer, minimum: 0}
    PaymentPart:
      description: "inbound: a payment notification (Signal); only its note, never amounts or receipts"
      type: object
      required: [type]
      properties:
        type: {const: payment}
        note: {type: string}
    OtherPart:
      description: "inbound: something the gateway does not model yet (e.g. group call updates)"
      type: object
      required: [type, kind]
      properties:
        type: {const: other}
        kind: {type: string}
        data: {type: object}

    Target:
      description: where a message goes
      anyOf:
        - type: object
          required: [conversation_id]
          properties:
            conversation_id: {type: string, pattern: "^conv_"}
        - type: object
          required: [conversation]
          properties:
            conversation: {type: string, description: "label of a group in gateway.yaml conversations"}
        - type: object
          required: [person_id]
          properties:
            person_id: {type: string}
            channel: {$ref: "#/components/schemas/ChannelName"}
        - type: object
          required: [channel, address]
          properties:
            channel: {$ref: "#/components/schemas/ChannelName"}
            address: {type: string, description: "Signal ACI or E.164, Slack user id"}

    SendMessageRequest:
      type: object
      required: [to, parts]
      properties:
        to: {$ref: "#/components/schemas/Target"}
        parts: {type: array, minItems: 1, items: {$ref: "#/components/schemas/Part"}}
        reply_to: {type: string, description: "message_id in the same conversation"}
        idempotency_key: {type: string}
        wait_s:
          type: number
          maximum: 30
          description: "hold the answer up to this long (cap 30) until the platform took the message (200, status sent) or refused it for good (502 send_failed); still in flight at the deadline is 202, also on a retry. A finite number; checked before anything is queued. For run-and-exit consumers: retry a 202 with the same idempotency_key"

    MessageQueued:
      type: object
      required: [message_id, conversation_id, channel, status]
      properties:
        message_id: {type: string, pattern: "^msg_"}
        conversation_id: {type: string, pattern: "^conv_"}
        channel: {$ref: "#/components/schemas/ChannelName"}
        status: {enum: [queued, sent, delivered, read, deleted], description: "queued, unless wait_s saw it go out"}
        duplicate: {type: boolean}

    MessageView:
      type: object
      required: [id, conversation_id, direction, status, error]
      properties:
        id: {type: string}
        conversation_id: {type: string}
        direction: {type: string, enum: [in, out]}
        status: {type: string, enum: [received, queued, sent, delivered, read, failed, deleted]}
        error: {type: [string, "null"]}

    StartCallRequest:
      type: object
      required: [to]
      properties:
        to:
          oneOf:
            - {type: string, description: "E.164 for phone; Signal ACI or E.164 for signal; Slack user id (U...) for slack"}
            - type: object
              required: [person_id]
              properties:
                person_id: {type: string}
        via: {type: string, enum: [phone, signal, slack], description: "default: first voice channel the person has (phone, signal, slack)"}
        route: {type: string, description: "gateway route (agent media URL); default: the adapter's route"}
        idempotency_key: {type: string}

    CallStarted:
      type: object
      required: [call_id, state, channel]
      properties:
        call_id: {type: string, pattern: "^call_"}
        state: {const: initiated}
        channel: {$ref: "#/components/schemas/ChannelName"}
        duplicate: {type: boolean}

    CallView:
      type: object
      required: [call_id, state]
      properties:
        call_id: {type: string, pattern: "^call_"}
        channel: {$ref: "#/components/schemas/ChannelName"}
        direction: {type: string, enum: [inbound, outbound]}
        state: {type: string, enum: [initiated, ringing, answered, ended]}
        peer: {type: [string, "null"]}
        local: {type: [string, "null"]}
        person_id: {type: [string, "null"]}
        route: {type: [string, "null"]}
        reason: {type: [string, "null"]}
        answered: {type: boolean}
